# define default shell:
set -g default-shell /bin/zsh

# use 256 colour terminal:
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',xterm*:sitm=\E[3m'
set -as terminal-features ',xterm-256color:RGB'

# ESC latency for vim/nvim
set -sg escape-time 10

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Scrollback
set -g history-limit 50000

# Let vim/nvim know about terminal focus
setw -g focus-events on

# Show activity flag in the status bar
setw -g monitor-activity on

# Reorder windows
set -g renumber-windows on
bind-key Left swap-window -t -1 \; select-window -p
bind-key Right swap-window -t +1 \; select-window -n

# Move bar to the top
set -g status-position top
# Center the window list
set -g status-justify centre

## Theme
set -g @tmux_power_theme '#ffaf00'
set -g @tmux_power_prefix_highlight_pos 'L'
# Bold the date section
set -g @tmux_power_right_z_style 'bold'

# Resurrect session
set -g @resurrect-save 'K'
set -g @resurrect-restore 'L'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-capture-pane-contents on

# Mouse on
setw -g mouse on

## Map
# Change prefix keymap
unbind C-b
set -g prefix C-Space
bind Space send-prefix

# Change split keymaps
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

# Switch pane fullscreen
bind Z resize-pane -Z
bind z select-pane -t :.+ \; resize-pane -Z

# Remove confirmation
bind-key * kill-session
bind-key & kill-window
bind-key x kill-pane

# Copy mode - Vi
setw -g mode-keys vi
# System clipboard (Wayland)
set -g @copy_command 'wl-copy'
bind-key -n F9 copy-mode
bind-key -n F10 paste-buffer
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
bind-key -T copy-mode-vi Y send -X copy-selection
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# List of plugins
set -g @plugin 'wfxr/tmux-power'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'CrispyConductor/tmux-copy-toolkit'
set -g @plugin 'Morantron/tmux-fingers'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Init tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
